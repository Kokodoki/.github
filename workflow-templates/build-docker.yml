name: Build Docker

on:
  push:
    branches: [$default-branch]
  pull_request:
    branches: [$default-branch]

jobs:
  build-docker:
    uses: ${{ github.repository_owner }}/.github/.github/workflows/build-docker.yml@v1
    with:
      aws-region: us-east-1
      ecr-repository: mi-app
