name: Infra Terraform Azure

on:
  workflow_call:
    inputs:
      terraform-version:
        description: Versión de Terraform a utilizar
        type: string
        required: false
        default: latest
      working-directory:
        description: Directorio raíz de los archivos .tf
        type: string
        required: false
        default: .
      environment-name:
        description: Nombre del GitHub Environment para el gate de aprobación en apply
        type: string
        required: true
      backend-resource-group-name:
        description: Nombre del Resource Group de Azure donde está el Storage Account del backend
        type: string
        required: true
      backend-storage-account-name:
        description: Nombre del Storage Account de Azure para el backend de Terraform
        type: string
        required: true
      backend-container-name:
        description: Nombre del container del Storage Account para el backend de Terraform
        type: string
        required: true
      backend-key:
        description: Nombre del blob (clave) donde se almacena el estado de Terraform
        type: string
        required: true
      enable-apply:
        description: Habilita el job apply. Establecer en false para deshabilitar el apply (e.g. en Pull Requests)
        type: boolean
        required: false
        default: true
    secrets:
      azure-client-id:
        description: Client ID del App Registration de Azure AD (requerido para OIDC y Service Principal)
        required: true
      azure-tenant-id:
        description: Tenant ID del directorio de Azure AD
        required: true
      azure-subscription-id:
        description: Subscription ID de Azure donde se despliega la infraestructura
        required: true
      azure-client-secret:
        description: Client Secret del App Registration (solo para Service Principal; omitir para OIDC)
        required: false
    outputs:
      plan-exit-code:
        description: Código de salida de terraform plan (0=sin cambios, 2=con cambios)
        value: ${{ jobs.plan.outputs.plan-exit-code }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (sin backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      plan-exit-code: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
          client-secret: ${{ secrets.azure-client-secret }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ inputs.backend-resource-group-name }}" \
            -backend-config="storage_account_name=${{ inputs.backend-storage-account-name }}" \
            -backend-config="container_name=${{ inputs.backend-container-name }}" \
            -backend-config="key=${{ inputs.backend-key }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -detailed-exitcode -out=tfplan 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Verificar resultado del plan
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "Terraform plan falló con errores"
          exit 1

      - name: Upload tfplan artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/plan-output.txt
          retention-days: 7

      - name: Comentar plan en Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ inputs.working-directory }}/plan-output.txt', 'utf8');
            const truncated = planOutput.length > 65000
              ? planOutput.substring(0, 65000) + '\n\n... (output truncado, ver logs para el plan completo)'
              : planOutput;

            const body = `## Terraform Plan - \`${{ inputs.working-directory }}\`

            <details><summary>Mostrar Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Ejecutado por: @${{ github.actor }}, Workflow: \`${{ github.workflow }}\`, Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Terraform Plan') &&
              c.body.includes('${{ inputs.working-directory }}')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    if: inputs.enable-apply
    environment: ${{ inputs.environment-name }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}
          client-secret: ${{ secrets.azure-client-secret }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ inputs.backend-resource-group-name }}" \
            -backend-config="storage_account_name=${{ inputs.backend-storage-account-name }}" \
            -backend-config="container_name=${{ inputs.backend-container-name }}" \
            -backend-config="key=${{ inputs.backend-key }}"

      - name: Download tfplan artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ inputs.working-directory }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
