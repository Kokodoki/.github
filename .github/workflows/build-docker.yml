name: Build Docker

on:
  workflow_call:
    inputs:
      aws-region:
        description: Región de AWS donde está el repositorio de Amazon ECR
        type: string
        required: true
      ecr-repository:
        description: Nombre del repositorio en Amazon ECR (sin el prefijo del registry)
        type: string
        required: true
      image-tag:
        description: Tag de la imagen Docker. Si se omite, se usa el SHA del commit
        type: string
        required: false
        default: ""
      dockerfile:
        description: Ruta al Dockerfile relativa al contexto de construcción
        type: string
        required: false
        default: Dockerfile
      context:
        description: Contexto de construcción de Docker
        type: string
        required: false
        default: .
      build-args:
        description: Argumentos de construcción de Docker (formato KEY=VALUE, uno por línea)
        type: string
        required: false
        default: ""
      aws-role-to-assume:
        description: ARN del IAM Role a asumir tras la autenticación base (compatible con OIDC y credenciales estáticas)
        type: string
        required: false
        default: ""
      environment-name:
        description: Nombre del GitHub Environment para el gate de aprobación en el push
        type: string
        required: true
      enable-push:
        description: Habilita el push de la imagen al ECR. Establecer en false para solo construir sin publicar
        type: boolean
        required: false
        default: true
    secrets:
      aws-access-key-id:
        description: AWS Access Key ID para autenticación con credenciales estáticas
        required: false
      aws-secret-access-key:
        description: AWS Secret Access Key para autenticación con credenciales estáticas
        required: false
    outputs:
      image-uri:
        description: URI completa de la imagen publicada en ECR (disponible solo si enable-push es true)
        value: ${{ jobs.push.outputs.image-uri }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.image-tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Establecer tag de imagen
        id: image-tag
        run: |
          TAG="${{ inputs.image-tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA}"
          fi
          echo "value=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.ecr-repository }}:${{ steps.image-tag.outputs.value }}
          build-args: ${{ inputs.build-args }}
          outputs: type=docker,dest=/tmp/image.tar
          push: false

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}
          path: /tmp/image.tar
          retention-days: 1

  push:
    name: Push
    runs-on: ubuntu-latest
    needs: build
    if: inputs.enable-push
    environment: ${{ inputs.environment-name }}
    outputs:
      image-uri: ${{ steps.push.outputs.image-uri }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role-to-assume != '' && inputs.aws-role-to-assume || '' }}
          aws-access-key-id: ${{ secrets.aws-access-key-id }}
          aws-secret-access-key: ${{ secrets.aws-secret-access-key }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Tag and push to ECR
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ inputs.ecr-repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          IMAGE_URI=$REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker tag $REPOSITORY:$IMAGE_TAG $IMAGE_URI
          docker push $IMAGE_URI
          echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
